<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mora simulation results</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Geist, "DM Sans", system-ui, sans-serif;
        --bg: #f7f7f5;
        --surface: #ffffff;
        --text: #181817;
        --muted: #686864;
        --line: #deded8;
        --accent: #a44f2b;
        --accent-soft: #f4e8e1;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191918;
          --surface: #222220;
          --text: #f2f2ed;
          --muted: #aaa9a2;
          --line: #3c3c38;
          --accent: #e2916d;
          --accent-soft: #3b2820;
        }
      }

      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); }
      button { font: inherit; }
      .shell { min-height: 320px; max-height: 760px; overflow: auto; }
      .header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        padding: 20px 22px 16px;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(14px);
      }
      .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: -.025em; }
      .meta { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
      .count {
        align-self: center;
        color: var(--muted);
        font: 600 12px/1.4 ui-monospace, "SFMono-Regular", monospace;
      }
      .content { padding: 18px 22px 28px; }
      .section-label { margin: 0 0 12px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      .explorer { display: grid; grid-template-columns: minmax(220px, .85fr) minmax(0, 1.45fr); border-block: 1px solid var(--line); }
      .path-list { max-height: 520px; overflow: auto; border-right: 1px solid var(--line); }
      .path-row { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) 44px; gap: 10px; align-items: start; padding: 13px 14px; color: var(--text); text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; transition: background 180ms ease, transform 180ms ease; }
      .path-row:hover { background: color-mix(in srgb, var(--accent-soft) 54%, transparent); }
      .path-row:active { transform: translateY(1px); }
      .path-row[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
      .path-number, .path-probability { color: var(--accent); font: 650 11px/1.5 ui-monospace, "SFMono-Regular", monospace; }
      .path-copy { min-width: 0; display: grid; gap: 4px; }
      .path-copy strong { overflow: hidden; font-size: 13px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
      .path-copy small { display: -webkit-box; overflow: hidden; color: var(--muted); font-size: 11px; line-height: 1.4; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .path-probability { justify-self: end; color: var(--text); }
      .path-detail { min-height: 390px; padding: 24px 26px 28px; background: var(--surface); }
      .detail-heading { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
      .detail-kicker { margin: 0 0 5px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .detail-heading h2 { margin: 0; font-size: 19px; line-height: 1.25; letter-spacing: -.02em; }
      .probability { padding: 5px 8px; color: var(--accent); background: var(--accent-soft); border-radius: 5px; font: 650 11px/1.4 ui-monospace, "SFMono-Regular", monospace; }
      .premise { margin: 18px 0 0; padding: 12px 0 12px 14px; color: var(--muted); border-left: 2px solid var(--line); font-size: 12px; line-height: 1.55; }
      .narrative { margin: 18px 0 0; color: var(--text); font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
      .detail-footer { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 22px; padding-top: 13px; color: var(--muted); border-top: 1px solid var(--line); font-size: 11px; }
      .detail-footer strong { color: var(--text); font-weight: 600; }
      .context-note { margin-left: auto; color: var(--accent); }
      .synthesis-control { display: flex; justify-content: flex-end; margin-top: 14px; }
      .toggle { padding: 8px 11px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; transition: transform 160ms ease, border-color 160ms ease; }
      .toggle:hover { border-color: var(--accent); }
      .toggle:active { transform: translateY(1px); }
      .synthesis { margin-top: 14px; padding: 20px; background: var(--accent-soft); border-left: 3px solid var(--accent); }
      .synthesis h2 { margin: 0 0 14px; font-size: 16px; letter-spacing: -.015em; }
      .synthesis-body { color: var(--text); font-size: 13px; line-height: 1.6; }
      .synthesis-intro p { margin: 0 0 10px; }
      .synthesis-intro .verdict { font-weight: 650; }
      .synthesis-body section { margin-top: 16px; }
      .synthesis-body h3 { margin: 0 0 7px; font-size: 12px; }
      .synthesis-body ul { margin: 0; padding-left: 18px; color: var(--muted); }
      .state { padding: 28px 22px; }
      .state-line { width: 72%; height: 12px; margin: 10px 0; border-radius: 6px; background: var(--line); animation: pulse 1.4s ease-in-out infinite; }
      .state-line.short { width: 42%; }
      .error { color: #b33b32; }
      [hidden] { display: none !important; }
      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .state-line { animation: none; } }
      @media (max-width: 560px) {
        .header { grid-template-columns: 1fr; padding: 17px 16px 14px; }
        .content { padding: 15px 16px 22px; }
        .explorer { grid-template-columns: 1fr; }
        .path-list { max-height: 270px; border-right: 0; border-bottom: 1px solid var(--line); }
        .path-detail { min-height: 0; padding: 20px 16px 24px; }
        .context-note { width: 100%; margin-left: 0; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section id="loading" class="state" aria-live="polite">
        <p class="eyebrow">Mora simulation</p>
        <div class="state-line"></div>
        <div class="state-line short"></div>
      </section>
      <section id="error" class="state error" hidden></section>
      <section id="results" hidden>
        <header class="header">
          <div>
            <p class="eyebrow">Mora path explorer</p>
            <h1 id="title">Simulation results</h1>
            <p id="meta" class="meta"></p>
          </div>
          <span id="count" class="count"></span>
        </header>
        <div class="content">
          <p class="section-label">10 raw pathways — select one to inspect</p>
          <div class="explorer">
            <nav id="path-list" class="path-list" aria-label="Simulation pathways"></nav>
            <article id="path-detail" class="path-detail" aria-live="polite"></article>
          </div>
          <div class="synthesis-control">
            <button id="synthesis-toggle" class="toggle" type="button" aria-expanded="false">View Mora synthesis</button>
          </div>
          <section id="synthesis-panel" class="synthesis" hidden>
            <h2>Mora synthesis</h2>
            <div id="synthesis" class="synthesis-body"></div>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
