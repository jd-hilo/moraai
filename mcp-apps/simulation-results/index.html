<!doctype html>
<html lang="en" data-display-mode="inline">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mora simulation results</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        --bg: #fafafa;
        --surface-subtle: #f4f3f0;
        --text: #161514;
        --muted: #5f5c59;
        --quiet: #88827d;
        --line: #e4e0dc;
        --accent: #e87a7f;
        --accent-soft: #fbefed;
        --danger: #9c3a35;
        --danger-soft: #fbeeed;
      }

      * { box-sizing: border-box; }
      html, body { min-width: 0; margin: 0; background: var(--bg); }
      body { color: var(--text); -webkit-font-smoothing: antialiased; }
      button { font: inherit; }
      button:disabled { cursor: wait; opacity: .62; }
      [hidden] { display: none !important; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .shell {
        width: 100%;
        min-width: 0;
        min-height: 300px;
        background: var(--bg);
      }

      .state {
        min-height: 300px;
        display: grid;
        align-content: center;
        gap: 18px;
        padding: 30px 28px;
      }

      .state-brand,
      .brand-line {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        width: fit-content;
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .055em;
      }

      .brand-mark {
        position: relative;
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
        overflow: hidden;
        border-radius: 50%;
        background: var(--accent);
      }

      .brand-mark::after {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f4c9c7;
        content: "";
      }

      .state-copy { display: grid; gap: 10px; max-width: 560px; }
      .state-line {
        height: 11px;
        border-radius: 999px;
        background: #eeeeef;
      }
      .state-line.short { width: 56%; }
      .error-state { grid-template-columns: 38px minmax(0, 1fr); align-items: start; align-content: center; }
      .error-mark { width: 36px; height: 36px; display: grid; place-items: center; color: var(--danger); background: var(--danger-soft); border-radius: 50%; }
      .error-copy h2 { margin: 0; font-size: 16px; font-weight: 600; }
      .error-copy p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }

      .header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: end;
        padding: 25px 28px 22px;
        border-bottom: 1px solid var(--line);
      }

      .header-copy { min-width: 0; }
      .header-aside { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
      .brand-line { margin-bottom: 17px; }
      .eyebrow {
        margin: 0 0 7px;
        color: var(--accent);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: .1em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(24px, 5vw, 34px); font-weight: 500; line-height: 1.12; letter-spacing: -.035em; }
      .meta { max-width: 700px; margin: 9px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
      .count { color: var(--accent); font-size: 11px; font-weight: 600; white-space: nowrap; }

      .display-mode-toggle {
        min-height: 34px;
        padding: 0 12px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        cursor: pointer;
      }
      .display-mode-toggle:hover { background: var(--surface-subtle); }

      .content { padding: 22px 28px 30px; }
      .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 11px; }
      .section-label { margin: 0; color: var(--text); font-size: 12px; font-weight: 600; }
      .section-hint { margin: 0; color: var(--quiet); font-size: 10px; }

      .path-list {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        padding: 0 0 14px;
        border-bottom: 1px solid var(--line);
      }

      .path-row {
        min-width: 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 6px;
        align-items: center;
        min-height: 38px;
        padding: 7px 9px;
        color: var(--muted);
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 9px;
        cursor: pointer;
      }

      .path-row:hover { color: var(--text); background: var(--surface-subtle); }
      .path-row:focus-visible, .toggle:focus-visible, .display-mode-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .path-row:active, .toggle:active { transform: translateY(1px); }
      .path-row[aria-selected="true"] { color: var(--text); background: var(--accent-soft); border-color: #f1c7c9; }
      .path-number, .path-probability { font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .path-number { color: var(--accent); }
      .path-copy { min-width: 0; }
      .path-copy strong { display: block; overflow: hidden; font-size: 11px; font-weight: 600; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
      .path-copy small { display: none; }
      .path-probability { justify-self: end; color: currentColor; }

      .path-detail {
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(190px, .82fr) minmax(0, 1.38fr);
        grid-template-rows: auto auto minmax(36px, auto);
        column-gap: 25px;
        row-gap: 12px;
        align-items: start;
        padding: 20px 2px 6px;
      }
      .detail-heading { grid-column: 1; grid-row: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: start; }
      .detail-kicker { margin: 0 0 6px; color: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
      .detail-heading h2 { margin: 0; font-size: clamp(19px, 4vw, 24px); font-weight: 500; line-height: 1.25; letter-spacing: -.025em; }
      .probability { color: var(--accent); font-size: 11px; font-weight: 600; line-height: 1.4; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .premise { max-width: 760px; margin: 0; padding-left: 12px; color: var(--muted); border-left: 2px solid #e4b5d3; font-size: 12px; line-height: 1.58; }
      .narrative { max-width: 800px; margin: 0; color: #35353b; font-size: 13px; line-height: 1.68; white-space: pre-wrap; }
      .narrative[data-expanded="false"] {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .premise { grid-column: 1; grid-row: 2; }
      .narrative { grid-column: 2; grid-row: 1 / span 2; }
      .detail-actions { grid-column: 2; grid-row: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0; }
      .detail-footer { grid-column: 1; grid-row: 3; display: flex; flex-wrap: wrap; gap: 5px 12px; margin: 0; padding-top: 9px; color: var(--quiet); border-top: 1px solid var(--line); font-size: 10px; }
      .detail-footer strong { color: var(--text); font-weight: 600; }
      .context-note { margin-left: auto; color: var(--accent); }

      .toggle { min-height: 36px; padding: 0 13px; color: var(--text); background: #fff; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
      .toggle:hover { background: var(--surface-subtle); }
      .synthesis { margin-top: 22px; padding-top: 24px; border-top: 1px solid var(--line); }
      .synthesis h2 { margin: 0 0 17px; font-size: 20px; font-weight: 500; letter-spacing: -.02em; }
      .synthesis-body { max-width: 820px; color: #35353b; font-size: 13px; line-height: 1.68; }
      .synthesis-intro p { margin: 0 0 11px; }
      .synthesis-intro .verdict { color: var(--text); font-size: 15px; font-weight: 600; }
      .synthesis-body section { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
      .synthesis-body h3 { margin: 0; color: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
      .synthesis-body ul { display: grid; gap: 8px; margin: 0; padding: 0; color: var(--muted); list-style: none; }
      .synthesis-body li { position: relative; padding-left: 14px; }
      .synthesis-body li::before { position: absolute; top: .72em; left: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); content: ""; }

      html[data-display-mode="inline"] .eyebrow { display: none; }
      html[data-display-mode="inline"] .path-copy { display: none; }
      html[data-display-mode="inline"] .path-row { grid-template-columns: auto minmax(0, 1fr); }
      html[data-display-mode="inline"] .path-probability { justify-self: end; }
      html[data-display-mode="inline"] .path-detail { padding-top: 17px; padding-bottom: 2px; }
      html[data-display-mode="inline"] .detail-kicker { margin-bottom: 4px; }
      html[data-display-mode="inline"] .detail-heading h2 { font-size: clamp(18px, 4vw, 21px); }
      html[data-display-mode="inline"] .premise {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }
      html[data-display-mode="inline"] .narrative { line-height: 1.65; }
      html[data-display-mode="inline"] .narrative[data-expanded="false"] { -webkit-line-clamp: 5; }
      html[data-display-mode="fullscreen"] .narrative[data-expanded="false"] {
        display: block;
        overflow: visible;
      }
      @media (max-width: 600px) {
        .state, .header, .content { padding-right: 17px; padding-left: 17px; }
        .header { grid-template-columns: 1fr; gap: 12px; }
        .header-aside { align-items: flex-start; }
        .section-heading { align-items: flex-start; flex-direction: column; gap: 4px; }
        .path-list { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
        .path-row { justify-items: center; padding: 7px 5px; }
        .path-probability { display: none; }
        .path-detail { display: block; }
        .detail-heading { grid-template-columns: 1fr; gap: 8px; }
        .probability { justify-self: start; }
        .premise { margin-top: 11px; }
        .narrative { margin-top: 13px; }
        html[data-display-mode="inline"] .narrative[data-expanded="false"] { -webkit-line-clamp: 3; }
        .detail-actions { margin-top: 12px; }
        .detail-footer { margin-top: 13px; }
        .context-note { width: 100%; margin-left: 0; }
        .synthesis-body section { grid-template-columns: 1fr; gap: 9px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section id="loading" class="state" aria-live="polite">
        <p class="state-brand"><span class="brand-mark" aria-hidden="true"></span><span>Mora simulation</span></p>
        <div class="state-copy" aria-label="Loading simulation results">
          <div class="state-line"></div>
          <div class="state-line short"></div>
        </div>
      </section>
      <section id="error" class="state error-state" role="alert" hidden></section>
      <section id="results" hidden>
        <header class="header">
          <div class="header-copy">
            <p class="brand-line"><span class="brand-mark" aria-hidden="true"></span><span>Mora simulation</span></p>
            <p class="eyebrow">Path explorer</p>
            <h1 id="title">Simulation results</h1>
            <p id="meta" class="meta"></p>
          </div>
          <div class="header-aside">
            <span id="count" class="count"></span>
            <button id="display-mode-toggle" class="display-mode-toggle" type="button" hidden>Back to chat</button>
          </div>
        </header>
        <div class="content">
          <div class="section-heading">
            <p class="section-label">Explore ten possible paths</p>
            <p class="section-hint">All ten stay in view</p>
          </div>
          <nav id="path-list" class="path-list" role="tablist" aria-label="Simulation paths"></nav>
          <article id="path-detail" class="path-detail" role="tabpanel" aria-live="polite"></article>
          <button id="synthesis-toggle" class="toggle" type="button" aria-expanded="false" aria-controls="path-narrative synthesis-panel" hidden>Read full path</button>
          <section id="synthesis-panel" class="synthesis" hidden>
            <h2>Mora synthesis</h2>
            <div id="synthesis" class="synthesis-body"></div>
          </section>
          <p id="mode-status" class="sr-only" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
