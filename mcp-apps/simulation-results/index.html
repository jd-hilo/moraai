<!doctype html>
<html lang="en" data-display-mode="inline">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mora simulation results</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #faf9f7;
        --surface: #ffffff;
        --surface-subtle: #f3f1ee;
        --text: #191817;
        --muted: rgba(25, 24, 23, .66);
        --quiet: rgba(25, 24, 23, .43);
        --line: rgba(25, 24, 23, .09);
        --accent: #d9797f;
        --accent-soft: #f8eceb;
        --ink: #23211f;
        --danger: #9c3a35;
        --danger-soft: #fbeeed;
        --display: ui-serif, Georgia, Cambria, "Times New Roman", serif;
      }

      * { box-sizing: border-box; }
      html, body { min-width: 0; margin: 0; background: var(--bg); }
      body { color: var(--text); -webkit-font-smoothing: antialiased; }
      button { font: inherit; }
      button:disabled { cursor: wait; opacity: .62; }
      [hidden] { display: none !important; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .shell {
        width: 100%;
        min-width: 0;
        min-height: 300px;
        background: var(--bg);
      }

      .state {
        min-height: 300px;
        display: grid;
        align-content: center;
        gap: 20px;
        padding: 34px 30px;
        background:
          radial-gradient(circle at 84% 24%, rgba(228, 181, 211, .18), transparent 30%),
          var(--surface);
      }

      .state-brand,
      .brand-line {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        margin: 0;
      }

      .brand-logo {
        width: auto;
        height: 31px;
        flex: 0 0 auto;
        display: block;
      }

      .state-copy { display: grid; gap: 10px; max-width: 480px; }
      .state-line {
        height: 10px;
        border-radius: 999px;
        background: #ece9e6;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .state-line.short { width: 54%; }
      .error-state { grid-template-columns: 38px minmax(0, 1fr); align-items: start; align-content: center; }
      .error-mark { width: 36px; height: 36px; display: grid; place-items: center; color: var(--danger); background: var(--danger-soft); border-radius: 50%; }
      .error-copy h2 { margin: 0; font-size: 16px; font-weight: 650; }
      .error-copy p { max-width: 56ch; margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }

      .header {
        display: grid;
        gap: 21px;
        overflow: hidden;
        padding: 24px 30px 23px;
        background:
          radial-gradient(circle at 88% 30%, rgba(228, 181, 211, .17), transparent 28%),
          radial-gradient(circle at 76% 72%, rgba(232, 184, 166, .12), transparent 25%),
          var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .header-main {
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 28px;
        align-items: end;
      }
      .header-copy { min-width: 0; }
      .header-aside { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
      h1 {
        max-width: 760px;
        margin: 0;
        font-family: var(--display);
        font-size: clamp(28px, 5vw, 38px);
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -.035em;
      }
      .meta { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .count {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        white-space: nowrap;
      }
      .count::before {
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
        content: "";
      }

      .display-mode-toggle,
      .toggle {
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 180ms cubic-bezier(.16, 1, .3, 1), background-color 180ms ease, border-color 180ms ease;
      }
      .display-mode-toggle {
        color: var(--text);
        font-size: 11px;
        font-weight: 650;
        background: rgba(255, 255, 255, .68);
        border: 1px solid var(--line);
      }
      .display-mode-toggle:hover { background: var(--surface); border-color: rgba(25, 24, 23, .17); }

      .content {
        width: 100%;
        max-width: 980px;
        margin: 0 auto;
        padding: 20px 30px 30px;
      }
      .section-heading { margin-bottom: 10px; }
      .section-label { margin: 0; color: var(--text); font-size: 12px; font-weight: 650; letter-spacing: -.01em; }

      .path-list {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .path-row {
        min-width: 0;
        min-height: 46px;
        display: grid;
        grid-template-columns: auto auto;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        padding: 8px 11px;
        color: var(--muted);
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 180ms cubic-bezier(.16, 1, .3, 1), color 180ms ease, background-color 180ms ease, border-color 180ms ease;
      }

      .path-row:hover { color: var(--text); background: var(--surface-subtle); }
      .path-row:focus-visible, .toggle:focus-visible, .display-mode-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .path-row:active, .toggle:active { transform: translateY(1px); }
      .path-row[aria-selected="true"] { color: var(--text); background: var(--accent-soft); border-color: rgba(217, 121, 127, .2); }
      .path-number, .path-probability { font-variant-numeric: tabular-nums; }
      .path-number { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
      .path-probability { color: currentColor; font-size: 10px; font-weight: 650; opacity: .74; }
      .path-row[aria-selected="true"] .path-probability { opacity: 1; }

      .path-detail {
        min-width: 0;
        width: 100%;
        margin-top: 14px;
        padding: 24px 26px 22px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 18px 44px rgba(56, 45, 37, .045);
      }
      .detail-heading { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 22px; align-items: start; }
      .detail-kicker { margin: 0 0 5px; color: var(--quiet); font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .detail-heading h2 { max-width: 660px; margin: 0; font-family: var(--display); font-size: clamp(24px, 4vw, 30px); font-weight: 400; line-height: 1.12; letter-spacing: -.025em; }
      .probability {
        padding: 5px 9px;
        color: #985057;
        font-size: 10px;
        font-weight: 700;
        line-height: 1.4;
        white-space: nowrap;
        background: var(--accent-soft);
        border-radius: 999px;
        font-variant-numeric: tabular-nums;
      }
      .premise { max-width: 66ch; margin: 13px 0 0; color: var(--muted); font-size: 13px; line-height: 1.58; }
      .narrative {
        display: none;
        max-width: 72ch;
        margin: 22px 0 0;
        padding-top: 20px;
        color: #393633;
        border-top: 1px solid var(--line);
        font-size: 14px;
        line-height: 1.74;
        white-space: pre-wrap;
      }
      .narrative[data-expanded="true"] { display: block; }
      .detail-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 17px 0 0; }
      .detail-stats { display: none; flex-wrap: wrap; gap: 7px 16px; margin: 20px 0 0; color: var(--quiet); font-size: 10px; }
      .detail-stats strong { color: var(--text); font-weight: 650; }

      .toggle {
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        background: var(--ink);
        border: 1px solid var(--ink);
      }
      .toggle:hover { background: #3a3734; }
      .synthesis { width: 100%; margin-top: 16px; padding: 24px 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; }
      .synthesis h2 { margin: 0 0 17px; font-family: var(--display); font-size: 24px; font-weight: 400; letter-spacing: -.02em; }
      .synthesis-body { max-width: 76ch; color: #393633; font-size: 13px; line-height: 1.68; }
      .synthesis-intro p { margin: 0 0 11px; }
      .synthesis-intro .verdict { color: var(--text); font-family: var(--display); font-size: 18px; }
      .synthesis-body section { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 18px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
      .synthesis-body h3 { margin: 0; color: var(--quiet); font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      .synthesis-body ul { display: grid; gap: 8px; margin: 0; padding: 0; color: var(--muted); list-style: none; }
      .synthesis-body li { position: relative; padding-left: 14px; }
      .synthesis-body li::before { position: absolute; top: .72em; left: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); content: ""; }

      html[data-display-mode="fullscreen"] .content { padding-top: 26px; padding-bottom: 42px; }
      html[data-display-mode="fullscreen"] .narrative { display: block; }
      html[data-display-mode="fullscreen"] .detail-stats { display: flex; }

      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) {
        .state-line { animation: none; }
        .path-row, .toggle, .display-mode-toggle { transition: none; }
      }

      @media (max-width: 560px) {
        .state, .header, .content { padding-right: 18px; padding-left: 18px; }
        .header { gap: 18px; }
        .header-main { grid-template-columns: 1fr; gap: 14px; }
        .header-aside { justify-content: flex-start; }
        .path-list { gap: 4px; }
        .path-row { min-height: 48px; grid-template-columns: 1fr; gap: 2px; justify-items: center; justify-content: center; padding: 6px 4px; text-align: center; }
        .path-detail, .synthesis { padding-right: 20px; padding-left: 20px; border-radius: 19px; }
        .detail-heading { grid-template-columns: 1fr; gap: 9px; }
        .probability { justify-self: start; }
        .premise { margin-top: 12px; }
        .synthesis-body section { grid-template-columns: 1fr; gap: 9px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section id="loading" class="state" aria-live="polite">
        <p class="state-brand"><img class="brand-logo" src="../../public/mora-logo-mcp.png" alt="Mora" width="240" height="72" /></p>
        <div class="state-copy" aria-label="Loading simulation results">
          <div class="state-line"></div>
          <div class="state-line short"></div>
        </div>
      </section>
      <section id="error" class="state error-state" role="alert" hidden></section>
      <section id="results" hidden>
        <header class="header">
          <p class="brand-line"><img class="brand-logo" src="../../public/mora-logo-mcp.png" alt="Mora" width="240" height="72" /></p>
          <div class="header-main">
            <div class="header-copy">
              <h1 id="title">Simulation results</h1>
              <p id="meta" class="meta"></p>
            </div>
            <div class="header-aside">
              <span id="count" class="count"></span>
              <button id="display-mode-toggle" class="display-mode-toggle" type="button" hidden>Back to chat</button>
            </div>
          </div>
        </header>
        <div class="content">
          <div class="section-heading">
            <p class="section-label">Possible paths</p>
          </div>
          <nav id="path-list" class="path-list" role="tablist" aria-label="Simulation paths"></nav>
          <article id="path-detail" class="path-detail" role="tabpanel" aria-live="polite"></article>
          <button id="synthesis-toggle" class="toggle" type="button" aria-expanded="false" aria-controls="path-narrative synthesis-panel" hidden>Read path</button>
          <section id="synthesis-panel" class="synthesis" hidden>
            <h2>Mora synthesis</h2>
            <div id="synthesis" class="synthesis-body"></div>
          </section>
          <p id="mode-status" class="sr-only" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
