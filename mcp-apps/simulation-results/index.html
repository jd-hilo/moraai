<!doctype html>
<html lang="en" data-display-mode="inline">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mora simulation results</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #fafafa;
        --surface: #ffffff;
        --surface-subtle: #f3f3f1;
        --text: #161514;
        --muted: rgba(22, 21, 20, .68);
        --quiet: rgba(22, 21, 20, .45);
        --line: rgba(22, 21, 20, .09);
        --accent: #e87a7f;
        --accent-mid: #e4b5d3;
        --accent-warm: #e4b8a6;
        --accent-soft: #fbefed;
        --ink: #1a1918;
        --danger: #9c3a35;
        --danger-soft: #fbeeed;
        --display: ui-serif, Georgia, Cambria, "Times New Roman", serif;
      }

      * { box-sizing: border-box; }
      html, body { min-width: 0; margin: 0; background: var(--bg); }
      body { color: var(--text); -webkit-font-smoothing: antialiased; }
      button { font: inherit; }
      button:disabled { cursor: wait; opacity: .62; }
      [hidden] { display: none !important; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .shell {
        width: 100%;
        min-width: 0;
        min-height: 300px;
        background: var(--bg);
      }

      .state {
        min-height: 300px;
        display: grid;
        align-content: center;
        gap: 18px;
        padding: 34px 32px;
      }

      .state-brand,
      .brand-line {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -.01em;
      }

      .brand-mark {
        position: relative;
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        display: block;
        overflow: hidden;
        background: linear-gradient(135deg, var(--accent), var(--accent-mid) 54%, var(--accent-warm));
        border: 1px solid rgba(22, 21, 20, .08);
        border-radius: 50%;
      }
      .brand-mark::after {
        position: absolute;
        top: 3px;
        left: 4px;
        width: 7px;
        height: 7px;
        background: rgba(255, 255, 255, .7);
        border-radius: 50%;
        content: "";
      }
      .brand-word {
        color: var(--text);
        font-family: var(--display);
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -.025em;
      }

      .state-copy { display: grid; gap: 10px; max-width: 480px; }
      .state-line {
        height: 11px;
        border-radius: 999px;
        background: #eceae8;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .state-line.short { width: 56%; }
      .error-state { grid-template-columns: 38px minmax(0, 1fr); align-items: start; align-content: center; }
      .error-mark { width: 36px; height: 36px; display: grid; place-items: center; color: var(--danger); background: var(--danger-soft); border-radius: 50%; }
      .error-copy h2 { margin: 0; font-size: 16px; font-weight: 600; }
      .error-copy p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }

      .header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 32px;
        align-items: center;
        padding: 28px 32px 27px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .header-copy { min-width: 0; }
      .header-aside { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
      .brand-line { margin-bottom: 20px; }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--quiet);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 780px;
        margin: 0;
        font-family: var(--display);
        font-size: clamp(29px, 5vw, 42px);
        font-weight: 400;
        line-height: 1.06;
        letter-spacing: -.035em;
      }
      .meta { max-width: 680px; margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      .count {
        padding: 5px 9px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        white-space: nowrap;
        background: var(--surface-subtle);
        border-radius: 999px;
      }

      .open-in-mora {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 17px;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-mid) 52%, var(--accent-warm) 100%);
        border: 1px solid rgba(255, 255, 255, .18);
        border-radius: 999px;
        box-shadow: 0 14px 30px rgba(188, 106, 109, .18), inset 0 1px 0 rgba(255, 255, 255, .42);
        cursor: pointer;
        transition: transform 180ms cubic-bezier(.16, 1, .3, 1), background-color 180ms ease, border-color 180ms ease;
      }
      .open-in-mora:hover { filter: saturate(1.05); transform: translateY(-1px); }
      .open-in-mora svg { width: 13px; height: 13px; flex: 0 0 auto; }

      .display-mode-toggle {
        min-height: 34px;
        padding: 0 12px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        cursor: pointer;
        transition: transform 180ms cubic-bezier(.16, 1, .3, 1), background-color 180ms ease;
      }
      .display-mode-toggle:hover { background: var(--surface-subtle); }

      .content { max-width: 1440px; margin: 0 auto; padding: 24px 32px 34px; }
      .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 13px; }
      .section-label { margin: 0; color: var(--text); font-family: var(--display); font-size: 18px; }
      .section-hint { margin: 0; color: var(--quiet); font-size: 10px; }

      .explorer {
        display: grid;
        grid-template-columns: minmax(236px, .72fr) minmax(0, 1.8fr);
        gap: 18px;
        align-items: start;
      }

      .path-list {
        position: relative;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 5px;
        padding: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(43, 34, 27, .035);
        scrollbar-width: none;
      }
      .path-list::-webkit-scrollbar { display: none; }

      .path-row {
        min-width: 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 5px 8px;
        align-items: center;
        min-height: 62px;
        padding: 9px 10px;
        color: var(--muted);
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 180ms cubic-bezier(.16, 1, .3, 1), color 180ms ease, background-color 180ms ease, border-color 180ms ease;
      }

      .path-row:hover { color: var(--text); background: var(--surface-subtle); }
      .path-row:focus-visible, .toggle:focus-visible, .display-mode-toggle:focus-visible, .open-in-mora:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .path-row:active, .toggle:active, .open-in-mora:active { transform: translateY(1px); }
      .path-row[aria-selected="true"] { color: #fff; background: var(--ink); border-color: var(--ink); }
      .path-number, .path-probability { font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .path-number { color: currentColor; }
      .path-copy { display: block; min-width: 0; }
      .path-copy strong { display: block; overflow: hidden; font-size: 11px; font-weight: 600; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
      .path-copy small { display: none; }
      .path-probability { grid-column: 2; color: currentColor; font-size: 9px; opacity: .62; }
      .path-row[aria-selected="true"] .path-probability { opacity: .72; }

      .path-detail {
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        row-gap: 0;
        align-items: start;
        max-width: none;
        min-height: 100%;
        margin-top: 0;
        padding: 26px 28px 24px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 16px 40px rgba(43, 34, 27, .045);
      }
      .detail-heading { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: start; }
      .detail-kicker { margin: 0 0 7px; color: var(--quiet); font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .detail-heading h2 { max-width: 700px; margin: 0; font-family: var(--display); font-size: clamp(24px, 4vw, 34px); font-weight: 400; line-height: 1.1; letter-spacing: -.025em; }
      .probability { padding: 6px 9px; color: #9c5257; font-size: 10px; font-weight: 700; line-height: 1.4; white-space: nowrap; background: var(--accent-soft); border-radius: 999px; font-variant-numeric: tabular-nums; }
      .premise { max-width: 720px; margin: 15px 0 0; color: var(--muted); font-size: 13px; line-height: 1.58; }
      .narrative { max-width: 760px; margin: 20px 0 0; color: #302e2c; font-size: 14px; line-height: 1.72; white-space: pre-wrap; }
      .narrative[data-expanded="false"] {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .detail-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 18px 0 0; }
      .detail-footer { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 20px 0 0; padding-top: 14px; color: var(--quiet); border-top: 1px solid var(--line); font-size: 9px; }
      .detail-footer strong { color: var(--text); font-weight: 600; }
      .context-note { margin-left: auto; color: var(--muted); }

      .toggle { min-height: 38px; padding: 0 16px; color: #fff; font-size: 12px; font-weight: 700; background: var(--ink); border: 1px solid var(--ink); border-radius: 999px; cursor: pointer; transition: transform 180ms cubic-bezier(.16, 1, .3, 1), background-color 180ms ease; }
      .toggle:hover { background: #34312f; }
      .synthesis { margin-top: 18px; padding: 26px 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; }
      .synthesis h2 { margin: 0 0 18px; font-family: var(--display); font-size: 26px; font-weight: 400; letter-spacing: -.02em; }
      .synthesis-body { max-width: 780px; color: #302e2c; font-size: 13px; line-height: 1.68; }
      .synthesis-intro p { margin: 0 0 11px; }
      .synthesis-intro .verdict { color: var(--text); font-family: var(--display); font-size: 19px; }
      .synthesis-body section { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
      .synthesis-body h3 { margin: 0; color: var(--quiet); font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      .synthesis-body ul { display: grid; gap: 8px; margin: 0; padding: 0; color: var(--muted); list-style: none; }
      .synthesis-body li { position: relative; padding-left: 14px; }
      .synthesis-body li::before { position: absolute; top: .72em; left: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); content: ""; }

      html[data-display-mode="inline"] .header { padding-top: 22px; padding-bottom: 21px; }
      html[data-display-mode="inline"] .brand-line { margin-bottom: 14px; }
      html[data-display-mode="inline"] .eyebrow { display: none; }
      html[data-display-mode="inline"] h1 { font-size: clamp(27px, 5vw, 35px); }
      html[data-display-mode="inline"] .meta {
        display: -webkit-box;
        overflow: hidden;
        margin-top: 6px;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 1;
      }
      html[data-display-mode="inline"] .content { padding-top: 20px; padding-bottom: 24px; }
      html[data-display-mode="inline"] .section-heading { margin-bottom: 10px; }
      html[data-display-mode="inline"] .path-detail { padding-top: 23px; padding-bottom: 22px; }
      html[data-display-mode="inline"] .detail-kicker { margin-bottom: 4px; }
      html[data-display-mode="inline"] .detail-heading h2 { font-size: clamp(23px, 4vw, 29px); }
      html[data-display-mode="inline"] .premise {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      html[data-display-mode="inline"] .narrative { line-height: 1.65; }
      html[data-display-mode="inline"] .narrative[data-expanded="false"] { -webkit-line-clamp: 4; }
      html[data-display-mode="fullscreen"] .narrative[data-expanded="false"] {
        display: block;
        overflow: visible;
      }
      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) {
        .state-line { animation: none; }
        .path-row, .toggle, .display-mode-toggle, .open-in-mora { transition: none; }
      }

      @media (max-width: 860px) {
        .explorer { grid-template-columns: minmax(0, 1fr); }
        .path-list {
          grid-template-columns: repeat(10, minmax(76px, 1fr));
          overflow-x: auto;
        }
        .path-row { grid-template-columns: 1fr; justify-items: center; min-height: 54px; padding: 7px 6px; text-align: center; }
        .path-copy { display: none; }
        .path-probability { grid-column: 1; }
        .path-detail { min-height: 0; }
      }

      @media (max-width: 720px) {
        .state, .header, .content { padding-right: 18px; padding-left: 18px; }
        .header { grid-template-columns: 1fr; gap: 16px; }
        .header-aside { flex-direction: row-reverse; align-items: center; justify-content: flex-end; }
        .count { margin-right: auto; }
        .section-heading { align-items: flex-start; flex-direction: column; gap: 3px; }
        .path-list { grid-template-columns: repeat(10, 62px); margin-right: -18px; padding-right: 18px; border-right: 0; border-radius: 18px 0 0 18px; }
        .path-detail, .synthesis { padding-right: 20px; padding-left: 20px; border-radius: 20px; }
        .detail-heading { grid-template-columns: 1fr; gap: 10px; }
        .probability { justify-self: start; }
        .premise { margin-top: 13px; }
        .narrative { margin-top: 17px; }
        html[data-display-mode="inline"] .narrative[data-expanded="false"] { -webkit-line-clamp: 3; }
        .detail-actions { margin-top: 15px; }
        .detail-footer { margin-top: 17px; }
        .context-note { width: 100%; margin-left: 0; }
        .synthesis-body section { grid-template-columns: 1fr; gap: 9px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section id="loading" class="state" aria-live="polite">
        <p class="state-brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-word">Mora</span><span>simulation</span></p>
        <div class="state-copy" aria-label="Loading simulation results">
          <div class="state-line"></div>
          <div class="state-line short"></div>
          <p style="margin: 2px 0 0; color: var(--quiet); font-size: 12px; line-height: 1.5;">Loading your possible futures. If this view does not finish, ask Claude to run the simulation again.</p>
        </div>
        <noscript>JavaScript is required to display the interactive result. Ask Claude to summarize the simulation or open it in Mora.</noscript>
      </section>
      <section id="error" class="state error-state" role="alert" hidden></section>
      <section id="results" hidden>
        <header class="header">
          <div class="header-copy">
            <p class="brand-line"><span class="brand-mark" aria-hidden="true"></span><span class="brand-word">Mora</span><span>simulation</span></p>
            <p class="eyebrow">Path explorer</p>
            <h1 id="title">Simulation results</h1>
            <p id="meta" class="meta"></p>
          </div>
          <div class="header-aside">
            <span id="count" class="count"></span>
            <button id="open-in-mora" class="open-in-mora" type="button" aria-label="Open this exact simulation in Mora">
              <span>Open in Mora</span>
              <svg aria-hidden="true" viewBox="0 0 16 16" fill="none">
                <path d="M6 3h7v7M13 3 5.5 10.5M11 9.5V13H3V5h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <button id="display-mode-toggle" class="display-mode-toggle" type="button" hidden>Back to chat</button>
          </div>
        </header>
        <div class="content">
          <div class="section-heading">
            <p class="section-label">Possible paths</p>
            <p class="section-hint">Choose one to explore</p>
          </div>
          <div class="explorer">
            <nav id="path-list" class="path-list" role="tablist" aria-label="Simulation paths"></nav>
            <article id="path-detail" class="path-detail" role="tabpanel" aria-live="polite"></article>
          </div>
          <button id="synthesis-toggle" class="toggle" type="button" aria-expanded="false" aria-controls="path-narrative synthesis-panel" hidden>Read full path</button>
          <section id="synthesis-panel" class="synthesis" hidden>
            <h2>Mora synthesis</h2>
            <div id="synthesis" class="synthesis-body"></div>
          </section>
          <p id="mode-status" class="sr-only" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
