<!doctype html>
<html lang="en" data-display-mode="inline">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mora simulation results</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #ffffff;
        --surface-subtle: #faf9f7;
        --text: #151412;
        --muted: rgba(21, 20, 18, .64);
        --quiet: rgba(21, 20, 18, .43);
        --line: rgba(21, 20, 18, .1);
        --accent: #d9797f;
        --accent-soft: #fbefed;
        --ink: #24221f;
        --danger: #9c3a35;
        --danger-soft: #fbeeed;
        --host-safe-bottom: 0px;
      }

      * { box-sizing: border-box; }
      html, body { min-width: 0; margin: 0; background: var(--bg); }
      html { scroll-padding-bottom: 260px; }
      body { color: var(--text); -webkit-font-smoothing: antialiased; }
      button { font: inherit; }
      button:disabled { cursor: default; opacity: .35; }
      [hidden] { display: none !important; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .shell {
        width: 100%;
        min-width: 0;
        min-height: 360px;
        background: var(--bg);
      }

      .state {
        min-height: 360px;
        display: grid;
        align-content: center;
        gap: 24px;
        padding: 42px 34px;
        background: var(--bg);
      }

      .state-brand,
      .brand-line {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        margin: 0;
      }

      .brand-logo {
        width: auto;
        height: 43px;
        flex: 0 0 auto;
        display: block;
      }

      .state-copy { display: grid; gap: 10px; max-width: 460px; }
      .state-line {
        height: 9px;
        border-radius: 999px;
        background: #eeecea;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .state-line.short { width: 48%; }
      .error-state { grid-template-columns: 38px minmax(0, 1fr); align-items: start; align-content: center; }
      .error-mark { width: 36px; height: 36px; display: grid; place-items: center; color: var(--danger); background: var(--danger-soft); border-radius: 50%; }
      .error-copy h2 { margin: 0; font-size: 16px; font-weight: 600; }
      .error-copy p { max-width: 56ch; margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }

      .header {
        display: grid;
        gap: 26px;
        overflow: hidden;
        padding: 30px 34px 28px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }

      .header-main {
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 28px;
        align-items: end;
      }
      .header-copy { min-width: 0; }
      .header-aside { display: flex; align-items: center; justify-content: flex-end; }
      h1 {
        display: -webkit-box;
        overflow: hidden;
        max-width: 820px;
        min-height: 2.16em;
        margin: 0;
        font-size: clamp(30px, 5vw, 40px);
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -.04em;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .meta { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

      .display-mode-toggle,
      .path-arrow,
      .read-path,
      .open-in-mora {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 180ms cubic-bezier(.16, 1, .3, 1), background-color 180ms ease, border-color 180ms ease;
      }
      .display-mode-toggle {
        min-height: 36px;
        padding: 0 14px;
        color: var(--text);
        font-size: 11px;
        font-weight: 600;
        background: var(--bg);
        border: 1px solid var(--line);
      }
      .display-mode-toggle:hover { background: var(--surface-subtle); border-color: rgba(21, 20, 18, .18); }

      .content {
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
        padding: 24px 34px 32px;
      }

      .path-browser { min-width: 0; }
      .section-heading {
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 10px;
      }
      .section-label { margin: 0; color: var(--text); font-size: 12px; font-weight: 600; letter-spacing: -.01em; }
      .path-pager { display: flex; align-items: center; gap: 10px; }
      .path-position {
        min-width: 42px;
        color: var(--quiet);
        text-align: center;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .path-arrow {
        width: 36px;
        min-height: 36px;
        padding: 0;
        color: var(--text);
        background: transparent;
        border: 1px solid transparent;
      }
      .path-arrow:hover:not(:disabled) { background: var(--surface-subtle); border-color: var(--line); }
      .path-arrow svg { width: 15px; height: 15px; }

      .path-list {
        min-width: 0;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 1px 1px 8px;
        scroll-behavior: smooth;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
      }
      .path-list::-webkit-scrollbar { display: none; }

      .path-row {
        min-width: 0;
        height: 78px;
        flex: 0 0 clamp(174px, 29vw, 226px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 5px 12px;
        padding: 12px 14px;
        color: var(--muted);
        text-align: left;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 14px;
        cursor: pointer;
        scroll-snap-align: start;
        transition: transform 180ms cubic-bezier(.16, 1, .3, 1), color 180ms ease, background-color 180ms ease, border-color 180ms ease;
      }

      .path-row:hover { color: var(--text); background: var(--surface-subtle); }
      .path-row:focus-visible,
      .path-arrow:focus-visible,
      .read-path:focus-visible,
      .open-in-mora:focus-visible,
      .display-mode-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .path-row:active,
      .path-arrow:active,
      .read-path:active,
      .open-in-mora:active { transform: translateY(1px); }
      .path-row[aria-selected="true"] { color: var(--text); background: var(--accent-soft); border-color: rgba(217, 121, 127, .25); }
      .path-number,
      .path-probability { font-variant-numeric: tabular-nums; }
      .path-number { color: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: .08em; }
      .path-probability { color: currentColor; font-size: 10px; font-weight: 600; opacity: .72; }
      .path-row[aria-selected="true"] .path-probability { opacity: 1; }
      .path-name {
        display: -webkit-box;
        overflow: hidden;
        grid-column: 1 / -1;
        color: currentColor;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.28;
        letter-spacing: -.01em;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .path-detail {
        width: 100%;
        height: 222px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin-top: 0;
        padding: 20px 2px 4px;
        border-top: 1px solid var(--line);
      }
      .detail-heading { display: grid; gap: 8px; }
      .detail-topline {
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .detail-aside { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
      .detail-kicker { margin: 0; color: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; }
      .detail-heading h2 {
        display: -webkit-box;
        overflow: hidden;
        max-width: 690px;
        min-height: 1.1em;
        margin: 0;
        font-size: clamp(28px, 4.2vw, 38px);
        font-weight: 400;
        line-height: 1.1;
        letter-spacing: -.035em;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .path-summary {
        display: -webkit-box;
        overflow: hidden;
        max-width: 62ch;
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        letter-spacing: -.005em;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .probability {
        padding: 6px 10px;
        color: #985057;
        font-size: 10px;
        font-weight: 600;
        line-height: 1.4;
        white-space: nowrap;
        background: var(--accent-soft);
        border: 1px solid rgba(217, 121, 127, .17);
        border-radius: 999px;
        font-variant-numeric: tabular-nums;
      }
      .narrative {
        max-width: 68ch;
        margin: 28px 0 0;
        padding-top: 24px;
        color: #393633;
        border-top: 1px solid var(--line);
        font-size: 16px;
        line-height: 1.76;
        white-space: pre-wrap;
      }
      .detail-actions { display: flex; align-items: center; gap: 14px; }
      .read-path {
        min-width: 112px;
        padding: 0 18px;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        background: var(--ink);
        border: 1px solid var(--ink);
      }
      .read-path:hover { background: #3a3734; }
      .open-in-mora {
        gap: 7px;
        padding: 0 4px;
        color: var(--text);
        font-size: 12px;
        font-weight: 500;
        background: transparent;
        border: 0;
      }
      .open-in-mora:hover { color: var(--accent); }
      .open-in-mora svg { width: 13px; height: 13px; }

      html[data-display-mode="fullscreen"] body { min-height: 100dvh; }
      html[data-display-mode="fullscreen"] .header { padding-top: 24px; padding-bottom: 22px; }
      html[data-display-mode="fullscreen"] .path-browser { display: none; }
      html[data-display-mode="fullscreen"] .content {
        max-width: 820px;
        padding-top: 28px;
        padding-bottom: max(260px, calc(var(--host-safe-bottom) + env(safe-area-inset-bottom) + 220px));
        scroll-padding-bottom: 260px;
      }
      html[data-display-mode="fullscreen"] .path-detail {
        height: auto;
        min-height: 0;
        overflow: visible;
        margin-top: 0;
        padding-top: 18px;
        border-top: 0;
      }
      html[data-display-mode="fullscreen"] .detail-heading h2 {
        display: block;
        overflow: visible;
        min-height: 0;
      }
      html[data-display-mode="fullscreen"] .path-summary { display: none; }
      html[data-display-mode="fullscreen"] .detail-topline { align-items: flex-start; }
      html[data-display-mode="fullscreen"] .read-path { display: none; }

      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) {
        .state-line { animation: none; }
        .path-list { scroll-behavior: auto; }
        .path-row,
        .path-arrow,
        .read-path,
        .open-in-mora,
        .display-mode-toggle { transition: none; }
      }

      @media (max-width: 560px) {
        .state, .header, .content { padding-right: 20px; padding-left: 20px; }
        .brand-logo { height: 39px; }
        .header { gap: 22px; }
        .header-main { grid-template-columns: 1fr; gap: 14px; }
        .header-aside { justify-content: flex-start; }
        h1 { min-height: 2.28em; font-size: clamp(28px, 9vw, 36px); line-height: 1.14; }
        .path-row { flex-basis: min(74vw, 230px); }
        .path-detail { height: 236px; padding-top: 20px; }
        .detail-heading { gap: 12px; }
        .detail-topline { align-items: flex-start; }
        .detail-aside { flex-wrap: wrap; gap: 10px; }
        .detail-heading h2 { font-size: 30px; }
        .detail-actions { gap: 10px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section id="loading" class="state" aria-live="polite">
        <p class="state-brand"><img class="brand-logo" src="../../public/mora-logo-mcp.png" alt="Mora" width="240" height="72" /></p>
        <div class="state-copy" aria-label="Loading simulation results">
          <div class="state-line"></div>
          <div class="state-line short"></div>
        </div>
      </section>
      <section id="error" class="state error-state" role="alert" hidden></section>
      <section id="results" hidden>
        <header class="header">
          <p class="brand-line"><img class="brand-logo" src="../../public/mora-logo-mcp.png" alt="Mora" width="240" height="72" /></p>
          <div class="header-main">
            <div class="header-copy">
              <h1 id="title">Simulation results</h1>
              <p id="meta" class="meta"></p>
            </div>
            <div class="header-aside">
              <button id="display-mode-toggle" class="display-mode-toggle" type="button" hidden>Back to chat</button>
            </div>
          </div>
        </header>
        <div class="content">
          <section class="path-browser" aria-labelledby="paths-label">
            <div class="section-heading">
              <p id="paths-label" class="section-label">Possible paths</p>
              <div class="path-pager" aria-label="Path navigation">
                <button id="previous-path" class="path-arrow" type="button" aria-label="Previous path">
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m9.75 3.5-4.5 4.5 4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
                </button>
                <span id="path-position" class="path-position">1 / 10</span>
                <button id="next-path" class="path-arrow" type="button" aria-label="Next path">
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6.25 3.5 4.5 4.5-4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
                </button>
              </div>
            </div>
            <nav id="path-list" class="path-list" role="tablist" aria-label="Simulation paths"></nav>
          </section>
          <article id="path-detail" class="path-detail" role="tabpanel" aria-live="polite"></article>
          <button id="read-path" class="read-path" type="button">Read path</button>
          <button id="open-in-mora" class="open-in-mora" type="button">
            Open in Mora
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M9.5 2.75h3.75V6.5M13 3 7.5 8.5M6.5 4H3.75a1 1 0 0 0-1 1v7.25a1 1 0 0 0 1 1H11a1 1 0 0 0 1-1V9.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <p id="mode-status" class="sr-only" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
